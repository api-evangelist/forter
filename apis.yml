aid: forter
url: https://raw.githubusercontent.com/api-evangelist/forter/refs/heads/main/apis.yml
name: Forter
kind: company
description: Forter is a fraud prevention and digital identity platform for online
  commerce. Its Decision API returns real-time trust-or-not decisions for orders,
  payments, account signups, and logins, drawing on a global identity graph and
  machine learning trained across a large network of merchants. Beyond fraud
  management, Forter covers chargeback recovery, abuse prevention, payment
  optimization, 3DS orchestration, and identity protection. Access is enterprise /
  contact-sales - API credentials (a per-account site ID and API key) are
  provisioned by Forter during onboarding, and requests are sent to a dedicated
  per-tenant host.
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
tags:
- Fraud Detection
