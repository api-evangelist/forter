apis:
- aid: forter:forter-order-decision-api
  name: Forter Order Decision API
  tags:
  - Fraud Detection
  - Orders
  - Payments
  - Risk
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://docs.forter.com/reference/orders
  baseURL: https://api.forter.secure.com
  properties:
  - url: https://docs.forter.com/docs/api-overview
    type: Documentation
  - url: https://docs.forter.com/reference/orders
    type: APIReference
  - url: openapi/forter-openapi.yml
    type: OpenAPI
  - url: collections/forter.postman_collection.json
    type: PostmanCollection
  - url: collections/forter.opencollection.json
    type: OpenCollection
  description: Send order and checkout information to receive a real-time fraud or
    abuse decision (approve / decline / not-reviewed), with optional payment
    optimization and abuse-policy recommendations. Includes the v2 and v3 order
    decision endpoints and the order status endpoint used to report the downstream
    lifecycle of an order back to Forter.
