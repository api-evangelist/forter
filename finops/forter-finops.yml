- FOCUS
description: >-
  FinOps view of Forter spend. Forter is an enterprise, contact-sales fraud
  prevention and identity platform; there is no public price list or usage-based
  self-service billing for the Decision API. Cost is governed by a negotiated
  enterprise contract, commonly structured around protected transaction / order
  volume and the set of enabled products (fraud management, chargeback recovery,
  abuse prevention, payment optimization, identity protection). Because pricing
  is bespoke and not published, the meters and per-unit rates below are modeled
  cost dimensions for allocation, not reconciled figures.
notes: >-
  Per-unit rates are not reconciled; obtain them from your Forter agreement.
  Some Forter commercial models are performance-aligned (for example, chargeback
  recovery is often tied to recovered/guaranteed chargebacks) - confirm the
  billing basis for each enabled product with Forter.
sources:
- https://www.forter.com/
- https://www.forter.com/platform/
