alignedWith:
  framework: FinOps Foundation Framework
  frameworkUrl: https://www.finops.org/framework/
  dataSpec: FOCUS
  dataSpecVersion: '1.3'
  dataSpecUrl: https://focus.finops.org/focus-specification/v1-3/
publisherName: Forter
serviceCategory: Fraud Prevention and Identity
billingModel:
  pricingCategory: Contract-Based
  billingFrequency: Monthly
  billingCurrency: USD
  chargeCategories:
  - Usage
  - Purchase
  - Adjustment
focusColumns:
  ServiceName: Forter Decision API
  ServiceCategory: Fraud Prevention and Identity
  ProviderName: Forter
  PublisherName: Forter
  InvoiceIssuerName: Forter
  BillingCurrency: USD
  ChargeCategory: Usage
  PricingCategory: Contract-Based
meters:
- name: protected_transactions
  description: Orders / transactions submitted to Forter for a decision - a common commercial basis.
  unit: transactions
  aggregation: sum
  dimensions:
  - account
  - site
- name: enabled_products
  description: Set of Forter product modules enabled under the contract (fraud, chargeback recovery, abuse, payment optimization, identity).
  unit: modules
  aggregation: max
  dimensions:
  - account
- name: recovered_chargebacks
  description: Chargebacks recovered or guaranteed - a performance-aligned dimension for chargeback recovery products.
  unit: chargebacks
  aggregation: sum
  dimensions:
  - account
principles:
- name: Visibility
  description: Track protected transaction volume per site and the set of enabled products against the contract.
- name: Allocation
  description: Map site IDs to business units / brands so decision volume and product costs map to internal cost centers.
- name: Optimization
  description: Enable only the products in use; scope integrations (orders, accounts, disputes) to the flows that need decisions.
- name: Accountability
  description: Review transaction volume and any performance-aligned charges (for example recovered chargebacks) against the negotiated agreement each billing period.
